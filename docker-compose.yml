version: '3.8'

services:
  db:
    image: postgres:15
    container_name: usenavi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: use_navi_date
    ports:
      - "10004:5432"   # usenavi-db.dev.sorune.org
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    networks:
      - use-navi-date-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usenavi-backend-dev
    environment:
      NODE_ENV: development
    ports:
      - "10003:3000"   # usenavi-api.dev.sorune.org
    depends_on:
      db:
        condition: service_healthy
    networks:
      - use-navi-date-network
    restart: unless-stopped

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: usenavi-frontend-dev
    environment:
      NODE_ENV: development
    ports:
      - "10002:3000"   # usenavi.dev.sorune.org
    depends_on:
      - backend-dev
    networks:
      - use-navi-date-network
    restart: unless-stopped

  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usenavi-backend-prod
    environment:
      NODE_ENV: production
    ports:
      - "10006:3000"   # usenavi-api.sorune.org
    depends_on:
      db:
        condition: service_healthy
    networks:
      - use-navi-date-network
    restart: unless-stopped

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: usenavi-frontend-prod
    environment:
      NODE_ENV: production
    ports:
      - "10005:3000"   # usenavi.sorune.org
    depends_on:
      - backend-prod
    networks:
      - use-navi-date-network
    restart: unless-stopped

networks:
  use-navi-date-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local